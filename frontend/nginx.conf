server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Żądania do API idą przez ten sam adres co frontend (brak CORS).
    # "api" to nazwa serwisu z docker-compose.yml.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /auth/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Aplikacja jednostronicowa: nieznane ścieżki (/account, /admin...) obsługuje Angular.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
